name: Syntax Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  check-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_OPTIONS: "--no-deprecation" # Hides the punycode deprecation warning
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check userscript syntax
        run: |
          node --check "Naughty Faction Companion.user.js"
      - name: Run FFScouter regression checks
        run: node "ffscouter-regression.test.js"
